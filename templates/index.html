<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Smart Attendance System</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg:        #080c10;
      --surface:   #0d1520;
      --border:    #1a2e44;
      --accent:    #00e5ff;
      --accent2:   #00ff88;
      --danger:    #ff3c5a;
      --text:      #cdd9e5;
      --muted:     #4a6070;
      --glow:      0 0 18px rgba(0,229,255,0.25);
      --font-mono: 'Share Tech Mono', monospace;
      --font-ui:   'Rajdhani', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-ui);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 16px 64px;
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(0,229,255,0.07) 0%, transparent 70%),
        repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(255,255,255,0.015) 40px),
        repeating-linear-gradient(90deg, transparent, transparent 39px, rgba(255,255,255,0.015) 40px);
    }

    /* ── Header ── */
    header {
      width: 100%;
      max-width: 900px;
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 36px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 20px;
    }

    .logo-icon {
      width: 46px; height: 46px;
      border: 2px solid var(--accent);
      border-radius: 10px;
      display: grid;
      place-items: center;
      box-shadow: var(--glow);
      flex-shrink: 0;
    }
    .logo-icon svg { width: 26px; height: 26px; }

    header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #fff;
    }
    header h1 span { color: var(--accent); }

    .status-pill {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(0,255,136,0.08);
      border: 1px solid rgba(0,255,136,0.25);
      border-radius: 999px;
      padding: 6px 14px;
      font-family: var(--font-mono);
      font-size: 0.78rem;
      color: var(--accent2);
    }
    .dot {
      width: 7px; height: 7px;
      background: var(--accent2);
      border-radius: 50%;
      animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes pulse {
      0%,100% { opacity: 1; transform: scale(1); }
      50%      { opacity: 0.4; transform: scale(0.7); }
    }

    /* ── Main grid ── */
    .main-grid {
      width: 100%;
      max-width: 900px;
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 20px;
    }
    @media (max-width: 740px) {
      .main-grid { grid-template-columns: 1fr; }
    }

    /* ── Card ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      font-size: 0.78rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .card-header .dot2 {
      width: 6px; height: 6px;
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 6px var(--accent);
    }

    /* ── Video feed ── */
    .video-wrap {
      position: relative;
      background: #000;
      aspect-ratio: 4/3;
      overflow: hidden;
    }
    .video-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .scan-line {
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 3px,
        rgba(0,229,255,0.025) 4px
      );
      pointer-events: none;
    }
    .corner {
      position: absolute;
      width: 18px; height: 18px;
      border-color: var(--accent);
      border-style: solid;
      opacity: 0.7;
    }
    .corner.tl { top:10px; left:10px;  border-width: 2px 0 0 2px; }
    .corner.tr { top:10px; right:10px; border-width: 2px 2px 0 0; }
    .corner.bl { bottom:10px; left:10px;  border-width: 0 0 2px 2px; }
    .corner.br { bottom:10px; right:10px; border-width: 0 2px 2px 0; }

    .video-footer {
      padding: 10px 16px;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
    }
    .video-footer span { color: var(--accent2); }

    /* ── Chatbot ── */
    .chat-panel {
      display: flex;
      flex-direction: column;
    }

    .chat-messages {
      flex: 1;
      min-height: 280px;
      max-height: 380px;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    .msg {
      display: flex;
      flex-direction: column;
      gap: 4px;
      animation: fadeIn 0.25s ease;
    }
    @keyframes fadeIn { from { opacity:0; transform: translateY(6px); } to { opacity:1; transform: translateY(0); } }

    .msg-label {
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .msg-bubble {
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.95rem;
      line-height: 1.5;
      max-width: 92%;
      font-family: var(--font-ui);
      font-weight: 400;
    }
    .msg.user .msg-bubble {
      background: rgba(0,229,255,0.1);
      border: 1px solid rgba(0,229,255,0.2);
      color: #e0f4ff;
      align-self: flex-end;
    }
    .msg.user { align-items: flex-end; }
    .msg.bot .msg-bubble {
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      color: var(--text);
    }

    .typing-indicator {
      display: none;
      gap: 5px;
      padding: 12px 14px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 10px;
      width: fit-content;
    }
    .typing-indicator.show { display: flex; }
    .typing-indicator span {
      width: 6px; height: 6px;
      background: var(--muted);
      border-radius: 50%;
      animation: bounce 1.1s infinite;
    }
    .typing-indicator span:nth-child(2) { animation-delay: 0.18s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.36s; }
    @keyframes bounce {
      0%,80%,100% { transform: translateY(0); }
      40%         { transform: translateY(-6px); background: var(--accent); }
    }

    /* empty state */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 0.8rem;
      gap: 8px;
    }
    .empty-state svg { opacity: 0.3; }

    /* ── Input area ── */
    .chat-input-area {
      padding: 12px 14px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .chat-input-area input {
      flex: 1;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      font-family: var(--font-mono);
      font-size: 0.9rem;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .chat-input-area input::placeholder { color: var(--muted); }
    .chat-input-area input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(0,229,255,0.12);
    }

    .send-btn {
      background: var(--accent);
      border: none;
      border-radius: 8px;
      width: 40px; height: 40px;
      display: grid;
      place-items: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
      box-shadow: 0 0 12px rgba(0,229,255,0.3);
    }
    .send-btn:hover  { background: #33eeff; transform: scale(1.05); }
    .send-btn:active { transform: scale(0.96); }
    .send-btn:disabled { background: var(--border); box-shadow: none; cursor: not-allowed; }
    .send-btn svg { color: #000; }

    /* ── Error toast ── */
    #error-toast {
      position: fixed;
      bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--danger);
      color: #fff;
      padding: 10px 22px;
      border-radius: 8px;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      transition: transform 0.3s ease;
      z-index: 999;
    }
    #error-toast.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="logo-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#00e5ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2C9.5 2 7 4 7 7c0 3 2.5 5 5 5s5-2 5-5c0-3-2.5-5-5-5z"/>
        <path d="M3 20c0-4 4-7 9-7s9 3 9 7"/>
        <circle cx="19" cy="5" r="2" fill="#00e5ff" stroke="none"/>
      </svg>
    </div>
    <h1>Smart <span>Attendance</span></h1>
    <div class="status-pill">
      <span class="dot"></span> LIVE FEED
    </div>
  </header>

  <!-- Main layout -->
  <div class="main-grid">

    <!-- Video Card -->
    <div class="card">
      <div class="card-header">
        <span class="dot2"></span> Camera Feed
      </div>
      <div class="video-wrap">
        <img src="/video" alt="Live camera feed" onerror="this.src=''; this.alt='Camera unavailable'"/>
        <div class="scan-line"></div>
        <div class="corner tl"></div>
        <div class="corner tr"></div>
        <div class="corner bl"></div>
        <div class="corner br"></div>
      </div>
      <div class="video-footer">
        <span>REC ●</span>
        <span id="clock"></span>
      </div>
    </div>

    <!-- Chatbot Card -->
    <div class="card chat-panel">
      <div class="card-header">
        <span class="dot2"></span> AI Assistant
      </div>

      <div class="chat-messages" id="chat-messages" aria-live="polite" aria-label="Chat messages">
        <div class="empty-state" id="empty-state">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          </svg>
          Ask about attendance records or system status
        </div>
        <div class="msg bot" id="typing-row" style="display:none;">
          <span class="msg-label">Assistant</span>
          <div class="typing-indicator show">
            <span></span><span></span><span></span>
          </div>
        </div>
      </div>

      <div class="chat-input-area">
        <label for="query" class="sr-only">Ask the assistant</label>
        <input
          type="text"
          id="query"
          placeholder="Ask about attendance..."
          autocomplete="off"
          aria-label="Chat input"
        />
        <button class="send-btn" id="send-btn" onclick="ask()" aria-label="Send message" title="Send">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>
    </div>

  </div>

  <!-- Error Toast -->
  <div id="error-toast"></div>

  <style>
    .sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); }
  </style>

  <script>
    // ── Live clock ──
    function updateClock() {
      const now = new Date();
      document.getElementById('clock').textContent =
        now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }
    updateClock();
    setInterval(updateClock, 1000);

    // ── Toast helper ──
    function showError(msg) {
      const toast = document.getElementById('error-toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3500);
    }

    // ── Append message bubble ──
    function appendMessage(role, text) {
      const container = document.getElementById('chat-messages');
      const emptyState = document.getElementById('empty-state');
      const typingRow  = document.getElementById('typing-row');

      if (emptyState) emptyState.remove();

      // Insert before typing row
      const msg = document.createElement('div');
      msg.className = msg ${role};
      msg.innerHTML = `
        <span class="msg-label">${role === 'user' ? 'You' : 'Assistant'}</span>
        <div class="msg-bubble">${escapeHTML(text)}</div>
      `;
      container.insertBefore(msg, typingRow);
      container.scrollTop = container.scrollHeight;
    }

    function escapeHTML(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function setLoading(on) {
      const btn       = document.getElementById('send-btn');
      const input     = document.getElementById('query');
      const typingRow = document.getElementById('typing-row');
      btn.disabled    = on;
      input.disabled  = on;
      typingRow.style.display = on ? 'flex' : 'none';

      if (on) {
        const c = document.getElementById('chat-messages');
        c.scrollTop = c.scrollHeight;
      }
    }

    // ── Main ask function ──
    async function ask() {
      const input = document.getElementById('query');
      const query = input.value.trim();

      // ✅ Fix: empty input guard
      if (!query) {
        input.focus();
        showError('Please enter a question first.');
        return;
      }

      appendMessage('user', query);
      input.value = '';
      setLoading(true);

      try {
        const res = await fetch('/chatbot', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query })
        });

        // ✅ Fix: handle HTTP errors
        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          throw new Error(errData.error || Server error (${res.status}));
        }

        const data = await res.json();
        appendMessage('bot', data.response);

      } catch (err) {
        // ✅ Fix: network / parse error handling
        showError(err.message || 'Network error. Please try again.');
        appendMessage('bot', '⚠ Unable to get a response. Please try again.');
      } finally {
        setLoading(false);
        input.focus();
      }
    }

    // ✅ Fix: Enter key support
    document.getElementById('query').addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        ask();
      }
    });
  </script>
</body>
</html>
